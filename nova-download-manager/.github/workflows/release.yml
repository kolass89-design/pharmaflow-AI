name: Release

# For the standalone nova-download-manager repository.
# Push a tag like v0.1.0 to build everything and publish a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run build -w @nova/core
      - run: npm test
      - run: npm run zip -w @nova/extension
      - uses: actions/upload-artifact@v4
        with: { name: nova-extension, path: apps/extension/nova-extension.zip }

  windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run build -w @nova/core
      - run: npm run dist:win -w @nova/desktop
      - uses: actions/upload-artifact@v4
        with: { name: nova-windows, path: "apps/desktop/release/*" }

  linux:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run build -w @nova/core
      - run: npm run dist:linux -w @nova/desktop
      - uses: actions/upload-artifact@v4
        with: { name: nova-linux, path: "apps/desktop/release/*" }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Decode release keystore (if configured)
        working-directory: apps/android
        env:
          KEYSTORE_B64: ${{ secrets.NOVA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nova-release.jks"
            echo "NOVA_KEYSTORE_FILE=$RUNNER_TEMP/nova-release.jks" >> "$GITHUB_ENV"
          fi
      - working-directory: apps/android
        env:
          NOVA_KEYSTORE_PASSWORD: ${{ secrets.NOVA_KEYSTORE_PASSWORD }}
          NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: nova-android
          path: |
            apps/android/app/build/outputs/apk/release/*.apk
            apps/android/app/build/outputs/bundle/release/*.aab

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Collect release files
        run: |
          mkdir -p out
          find artifacts -type f \( -name "*.exe" -o -name "*.apk" -o -name "*.aab" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.tar.gz" \) -exec cp -v {} out/ \;
          ls -la out
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/* \
            --title "Nova Download Manager ${GITHUB_REF_NAME}" \
            --notes "See README and docs/FEATURE-MATRIX.md for exactly what is included. Windows builds are unsigned unless a code-signing certificate is configured; Android uses the debug key unless NOVA_KEYSTORE_* secrets are set."
