name: Nova Download Manager CI

# This workflow lives in the host repository while Nova is developed inside
# nova-download-manager/. It only runs for Nova-related pushes.
on:
  push:
    branches: ["arena/8c10c7b1-pharmaflow-ai", "main"]
    paths:
      - "nova-download-manager/**"
      - ".github/workflows/nova-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: nova-download-manager

jobs:
  test:
    name: Tests (core + bridge + extension) & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nova-download-manager/package-lock.json
      - name: Install (skip Electron binary for the test job)
        run: npm ci --ignore-scripts
      - name: Build core
        run: npm run build -w @nova/core
      - name: Typecheck desktop + extension
        run: |
          npx tsc -p apps/desktop/tsconfig.json --noEmit
          npx tsc -p apps/desktop/tsconfig.electron.json --noEmit
          npx tsc -p apps/extension/tsconfig.json --noEmit
      - name: Run all tests
        run: npm test
      - name: Build extension zip
        run: npm run zip -w @nova/extension
      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: nova-extension
          path: nova-download-manager/apps/extension/nova-extension.zip

  desktop-windows:
    name: Windows installer + portable
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nova-download-manager/package-lock.json
      - run: npm ci
      - run: npm run build -w @nova/core
      - name: Package Windows (NSIS installer + portable)
        run: npm run dist:win -w @nova/desktop
      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem apps/desktop/release | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: nova-windows
          path: |
            nova-download-manager/apps/desktop/release/*.exe
            nova-download-manager/apps/desktop/release/*.msi

  desktop-linux:
    name: Linux AppImage + tar.gz
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nova-download-manager/package-lock.json
      - run: npm ci
      - run: npm run build -w @nova/core
      - name: Package Linux
        run: npm run dist:linux -w @nova/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: nova-linux
          path: |
            nova-download-manager/apps/desktop/release/*.AppImage
            nova-download-manager/apps/desktop/release/*.tar.gz

  android:
    name: Android APK + AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Decode release keystore (if provided via secrets)
        working-directory: nova-download-manager/apps/android
        env:
          KEYSTORE_B64: ${{ secrets.NOVA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nova-release.jks"
            echo "NOVA_KEYSTORE_FILE=$RUNNER_TEMP/nova-release.jks" >> "$GITHUB_ENV"
            echo "Signing: release keystore from secrets"
          else
            echo "Signing: DEBUG key (no NOVA_KEYSTORE_BASE64 secret) — test builds only"
          fi
      - name: Build APK + AAB
        working-directory: nova-download-manager/apps/android
        env:
          NOVA_KEYSTORE_PASSWORD: ${{ secrets.NOVA_KEYSTORE_PASSWORD }}
          NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --stacktrace
      - name: List artifacts
        working-directory: nova-download-manager/apps/android
        run: find app/build/outputs -type f | sort
      - uses: actions/upload-artifact@v4
        with:
          name: nova-android
          path: |
            nova-download-manager/apps/android/app/build/outputs/apk/release/*.apk
            nova-download-manager/apps/android/app/build/outputs/bundle/release/*.aab
