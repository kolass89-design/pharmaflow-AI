# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploy with: Render Dashboard -> New -> Blueprint -> point at this repository.
# The service is a single Docker container that serves both the API and the
# web interface, so there is no database and no second service to manage.
services:
  - type: web
    name: docupro
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./docupro/Dockerfile
    dockerContext: ./docupro
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: DOCUPRO_DATA_DIR
        value: /data
      - key: DOCUPRO_WEB_DIR
        value: /app/web
      - key: DOCUPRO_RETENTION_MINUTES
        value: "30"
      - key: DOCUPRO_MAX_CONCURRENCY
        value: "2"
      - key: DOCUPRO_MAX_UPLOAD_MB
        value: "50"
      - key: DOCUPRO_TRUST_PROXY
        value: "1"
      - key: DOCUPRO_CORS_ORIGINS
        value: ""
    disk:
      name: docupro-data
      mountPath: /data
      sizeGB: 1
