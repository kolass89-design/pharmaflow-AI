# Self-hosted DOCUPRO: no external database, no external service.
#   cp .env.example .env
#   docker compose up -d --build
# The interface is served on http://localhost:8000 by the same container.
services:
  docupro:
    build:
      context: .
      args:
        INSTALL_OFFICE: "1"
    image: docupro:1.0.0
    container_name: docupro
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DOCUPRO_DATA_DIR: /data
      DOCUPRO_WEB_DIR: /app/web
    volumes:
      - docupro-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    # Memory headroom: LibreOffice needs ~600 MB, conversions run in workers.
    mem_limit: 2g
    cpus: "2.0"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  docupro-data:
