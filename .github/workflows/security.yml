name: Security

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "docupro/services/api/requirements*.txt"
      - "docupro/apps/web/package-lock.json"

permissions:
  contents: read

defaults:
  run:
    working-directory: docupro

jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r services/api/requirements.txt --strict
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm audit
        working-directory: docupro/apps/web
        run: npm audit --audit-level=high
